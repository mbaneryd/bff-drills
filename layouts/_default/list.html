{{ define "main" }}
<header>
  <h1>{{ .Title }}</h1>
  <nav><a href="{{ "exercises/" | relURL }}">← Övningar</a></nav>
</header>
<main>

      </div>
    </a>
    {{ end }}
  </div>
</main>
{{ end }}
