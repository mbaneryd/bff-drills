const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const catEl = document.getElementById('cat');
const ageEl = document.getElementById('age');
const srcBtns = document.querySelectorAll('.src-btn');
let activeSrc = 'all';

function render() {
  const q = qEl.value.toLowerCase();
  const cat = catEl.value;
  const age = ageEl.value;
  const filtered = DATA.filter(s => {
    if (activeSrc !== 'all' && s.source !== activeSrc) return false;
    if (q && !s.title.toLowerCase().includes(q) && !(s.topic||'').toLowerCase().includes(q) && !(s.category||'').toLowerCase().includes(q)) return false;
    if (cat && s.category !== cat) return false;
    if (age && s.ageGroup !== age) return false;
    return true;
  });
  countEl.textContent = filtered.length + ' pass';
  if (!filtered.length) { grid.innerHTML = '<div class="empty">Inga träningspass hittades</div>'; return; }
  grid.innerHTML = filtered.map(s => {
    const isJsk = s.source === 'jsk_ovningsbank';
    const jskBadge = isJsk ? '<span class="tag-jsk">JSK</span>' : '';
    const ageBadge = s.ageGroup ? `<span class="tag-age">${s.ageGroup} år</span>` : '';
    const fmtBadge = s.gameFormat ? `<span class="tag-fmt">${s.gameFormat}</span>` : '';
    const minsBadge = s.totalMinutes ? `<span class="tag-mins">${s.totalMinutes} min</span>` : '';
    const catBadge = s.category ? `<span class="tag-cat">${s.category}</span>` : '';
    const topicBadge = s.topic ? `<span class="tag-topic">${s.topic}</span>` : '';
    return `<a class="card" href="${s.href}">
      <div class="card-title">${s.title}</div>
      <div class="card-tags">
        ${jskBadge}${ageBadge}${fmtBadge}${catBadge}${topicBadge}${minsBadge}
        <span class="tag-count">${s.exerciseCount} övningar</span>
      </div>
    </a>`;
  }).join('');
}

srcBtns.forEach(btn => btn.addEventListener('click', () => {
  activeSrc = btn.dataset.src;
  srcBtns.forEach(b => b.classList.toggle('on', b === btn));
  render();
}));
qEl.addEventListener('input', render);
catEl.addEventListener('change', render);
ageEl.addEventListener('change', render);
render();
</script>
