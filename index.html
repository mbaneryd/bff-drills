.level-btns{display:flex;gap:.35rem}

.card-title{font-weight:600;font-size:.9rem;line-height:1.3}
.card-topic{font-size:.78rem;color:#666;line-height:1.3}
.card-tags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:auto;padding-top:.35rem}

.empty{padding:2rem;text-align:center;color:#888;grid-column:1/-1}

const countEl = document.getElementById('count');
const grid = document.getElementById('grid');
const qEl = document.getElementById('q');
const catEl = document.getElementById('cat');
const typeEl = document.getElementById('type');
const lvlBtns = document.querySelectorAll('.level-btn');
const srcBtns = document.querySelectorAll('.src-btn');
let activeLevels = new Set();
let activeSrc = 'all';

function render() {
  const q = qEl.value.toLowerCase();
  const cat = catEl.value;
  const typ = typeEl.value;
  const filtered = DATA.filter(e => {
    if (activeSrc !== 'all' && e.source !== activeSrc) return false;
    if (q && !e.title.toLowerCase().includes(q) && !(e.topic||'').toLowerCase().includes(q) && !(e.what||'').toLowerCase().includes(q)) return false;
    if (cat && e.category !== cat) return false;
    if (typ && e.exerciseType !== typ) return false;
    if (activeLevels.size > 0) {
      const hasLevel = [...activeLevels].some(l => e.levels && e.levels[l]);
      if (!hasLevel) return false;
    }
    return true;
  });
  countEl.textContent = filtered.length + ' övningar';
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Inga övningar hittades</div>';
    return;
  }
  grid.innerHTML = filtered.map(e => {
    const isJsk = e.source === 'jsk_ovningsbank';
    const lvlTags = Object.entries(e.levels||{}).filter(([,v])=>v).map(([k])=>`<span class="tag-lvl">${k}</span>`).join('');
    const imgSrc = e.image || '';
    const img = imgSrc
      ? `<img class="card-img" src="${imgSrc}" alt="" loading="lazy" onerror="imgErr(this)">`
      : '<div class="card-img-placeholder">⚽</div>';
    const href = isJsk ? `jsk/${e.id}.html` : `${e.id}.html`;
    const jskBadge = isJsk ? '<span class="tag-jsk">JSK</span>' : '';
    const ageBadge = (isJsk && e.ageGroup) ? `<span class="tag-age">${e.ageGroup} år</span>` : '';
    const topicLine = e.topic || e.what || '';
    return `<a class="card" href="${href}">
      ${img}
      <div class="card-body">
        <div class="card-title">${e.title||'(namnlös)'}</div>
        <div class="card-topic">${topicLine}</div>
        <div class="card-tags">
          ${jskBadge}
          ${ageBadge}
          ${e.category ? `<span class="tag-cat">${e.category}</span>` : ''}
          ${e.exerciseType ? `<span class="tag-type">${e.exerciseType}</span>` : ''}
          ${lvlTags}
        </div>
      </div>
    </a>`;
  }).join('');
}

qEl.addEventListener('input', render);
catEl.addEventListener('change', render);
typeEl.addEventListener('change', render);
lvlBtns.forEach(btn => btn.addEventListener('click', () => {
  const l = btn.dataset.lvl;
  if (activeLevels.has(l)) { activeLevels.delete(l); btn.classList.remove('on'); }
  else { activeLevels.add(l); btn.classList.add('on'); }
  render();
}));
srcBtns.forEach(btn => btn.addEventListener('click', () => {
  activeSrc = btn.dataset.src;
  srcBtns.forEach(b => b.classList.toggle('on', b === btn));
  render();
}));

function imgErr(el) { el.outerHTML = '<div class="card-img-placeholder">⚽</div>'; }
render();
</script>
